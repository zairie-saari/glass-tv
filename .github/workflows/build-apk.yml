name: Build Glass TV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/glass-tv-release.jks"
          chmod 600 "$RUNNER_TEMP/glass-tv-release.jks"

      - name: Verify release keystore
        run: |
          test -s "$RUNNER_TEMP/glass-tv-release.jks" || {
            echo "ERROR: Release keystore is missing or empty."
            exit 1
          }
          echo "Release keystore file exists."

      - name: Build and test APK
        working-directory: launcher
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/glass-tv-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glass-tv-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
